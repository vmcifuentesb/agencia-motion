<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames Composition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background: #090d16;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #151d2f 0%, #090d16 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .badge {
        padding: 10px 28px;
        border-radius: 9999px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #a5b4fc;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 80px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 16px 0;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        font-size: 32px;
        color: #94a3b8;
        max-width: 900px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <section id="hero-scene" class="clip" data-start="0" data-duration="5">
        <div id="hero-badge" class="badge">HyperFrames Studio</div>
        <h1 id="hero-title">Web-Native Motion Graphics</h1>
        <p id="hero-subtitle">Composición limpia, determinista y renderizable desde el DOM</p>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#hero-badge",
        { y: -20, opacity: 0.2 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      )
      .fromTo(
        "#hero-title",
        { y: 30, opacity: 0.4 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      )
      .fromTo(
        "#hero-subtitle",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" },
        0.3
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
